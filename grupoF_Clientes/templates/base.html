<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block titulo %}Clientes{% endblock %}</title>
	<style>
		body { font-family: system-ui, sans-serif; background:#f3f4f6; margin:0; }
		main { max-width: 440px; margin: 40px auto; background:#fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
		h1 { margin-top:0; font-size: 1.5rem; }
		label { display:block; margin-top: 14px; font-size:.9rem; font-weight:600; }
		input { width:100%; padding:9px; margin-top:4px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-size:1rem; }
		button { margin-top: 20px; width:100%; padding:10px; border:0; border-radius:6px; background:#2563eb; color:#fff; font-size:1rem; cursor:pointer; }
		button.sec { background:#64748b; margin-top:10px; }
		.error { background:#fee2e2; color:#991b1b; padding:10px; border-radius:6px; }
		.ok { background:#dcfce7; color:#166534; padding:10px; border-radius:6px; }
		p.link { text-align:center; margin-bottom:0; }
		small { color:#64748b; font-weight:400; }
	</style>
</head>
<body>
	<main>
		{% if error %}<div class="error">{{ error }}</div>{% endif %}
		{% if ok %}<div class="ok">{{ ok }}</div>{% endif %}
		{% block contenido %}{% endblock %}
	</main>
</body>
</html>
