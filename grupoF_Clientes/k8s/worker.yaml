apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: clientes
spec:
  replicas: 1   # puedes subirlo: varios workers consumen las mismas colas en paralelo
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: clientes-app:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - secretRef:
                name: clientes-env   # incluye CLOUDAMQP_URL y JWT_SECRET
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
