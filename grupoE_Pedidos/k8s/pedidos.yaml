# Aplicacion Pedidos (API REST + frontend + consumidores RabbitMQ).
# Los secretos (DB_USER, DB_PASSWORD, RABBITMQ_URL, JWT_SECRET, *_RPC_PASSWORD) los crea
# deploy.ps1 desde tu .env como Secret "pedidos-secret"; aqui no hay ningun valor sensible.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-config
  namespace: pedidos
data:
  PORT: "3000"
  DB_HOST: "pedidos-mysql"        # MySQL del cluster (antes: host.docker.internal, el MySQL de tu PC)
  DB_PORT: "3306"
  DB_NAME: "pedidos_db"
  RABBITMQ_EXCHANGE: "pedidos_exchange"
  RABBITMQ_EXCHANGE_TYPE: "fanout"
  RABBITMQ_ROUTING_KEY: "pedido.creado"
  RABBITMQ_AUDIT_QUEUE: "pedidos_creados_auditoria"
  RABBITMQ_CONSUMER_QUEUE: "simulador_pedidos_queue"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRES_IN: "1800"
  CLIENTES_RPC_USER: "modulo_pedidos"
  INVENTARIO_RPC_USER: "inventario"
  PRODUCTOS_RPC_USER: "productos"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-web
  namespace: pedidos
  labels:
    app: pedidos-web
spec:
  replicas: 1   # 1 sola: los consumidores RabbitMQ (carro, pagos, inventario) corren dentro de este proceso
  selector:
    matchLabels:
      app: pedidos-web
  template:
    metadata:
      labels:
        app: pedidos-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pedidos
          image: pedidos:lab-jwt-v1
          imagePullPolicy: IfNotPresent   # imagen construida localmente con docker build
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: pedidos-config
            - secretRef:
                name: pedidos-secret
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-web
  namespace: pedidos
  labels:
    app: pedidos-web
spec:
  type: LoadBalancer   # Docker Desktop lo publica en localhost
  selector:
    app: pedidos-web
  ports:
    - port: 3001       # 3001 y no 3000: el backend de Productos ya usa localhost:3000
      targetPort: 3000
