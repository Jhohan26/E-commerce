apiVersion: v1
kind: Service
metadata:
  name: pagos-mysql
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: pagos-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pagos-mysql
  namespace: ecommerce
spec:
  serviceName: pagos-mysql
  replicas: 1
  selector:
    matchLabels:
      app: pagos-mysql
  template:
    metadata:
      labels:
        app: pagos-mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: db_pagos
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: pagos-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pagos-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pagos-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
            - name: esquema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" -D db_pagos -e "SELECT 1 FROM pagos LIMIT 1" >/dev/null'
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: esquema
          configMap:
            name: pagos-schema
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
