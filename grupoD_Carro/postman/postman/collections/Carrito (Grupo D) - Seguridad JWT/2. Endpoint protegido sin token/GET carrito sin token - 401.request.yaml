$kind: http-request
name: GET carrito sin token -> 401
url: "{{base_url}}/api/carrito/{{cliente_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Código HTTP esperado: 401', function () { pm.expect(pm.response.code).to.be.oneOf([401]); });
      pm.test('Incluye WWW-Authenticate: Bearer', function () { pm.response.to.have.header('WWW-Authenticate', 'Bearer'); });
    language: text/javascript
order: 1000
