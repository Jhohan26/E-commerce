$kind: http-request
name: Operador consulta un carrito -> 403
url: "{{base_url}}/api/carrito/{{cliente_id}}"
method: GET
headers:
  Authorization: Bearer {{token_operador}}
scripts:
  - type: afterResponse
    code: "pm.test('Código HTTP esperado: 403', function () { pm.expect(pm.response.code).to.be.oneOf([403]); });"
    language: text/javascript
order: 1000
