# Acceso desde tu maquina sin port-forward (Docker Desktop publica los LoadBalancer en localhost).
# Es ADICIONAL al Service "carrito" (ClusterIP) que usan los demas modulos dentro del cluster.
# Si el puerto 8000 esta ocupado (uvicorn o docker run del carrito), cambia "port" por otro, p. ej. 8080.
apiVersion: v1
kind: Service
metadata:
  name: carrito-local
  namespace: carrito
  labels:
    app: carrito
spec:
  type: LoadBalancer
  selector:
    app: carrito
  ports:
    - name: http
      port: 8000
      targetPort: http
