services:
  notificaciones:
    build: .
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?Define la URL del RabbitMQ compartido en .env.integracion}
      RABBITMQ_REQUIRE_TLS: "true"
      RABBITMQ_SOURCES: ${RABBITMQ_SOURCES:?Define las fuentes de eventos en .env.integracion}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-30}
      RABBITMQ_MAX_MESSAGE_BYTES: ${RABBITMQ_MAX_MESSAGE_BYTES:-262144}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-comercio.eventos}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-grupo-j.notificaciones}
      RABBITMQ_BINDINGS: ${RABBITMQ_BINDINGS:-}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
      RABBITMQ_RECONNECT_MS: ${RABBITMQ_RECONNECT_MS:-5000}
      DATABASE_PATH: /app/data/notificaciones.sqlite
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    volumes:
      - notificaciones_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  notificaciones_data:
