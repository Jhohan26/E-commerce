services:
  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: notificaciones
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-demo}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  notificaciones:
    build: .
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://notificaciones:${RABBITMQ_PASSWORD:-local-demo}@rabbitmq:5672}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-comercio.eventos}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE:-topic}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-grupo-j.notificaciones}
      RABBITMQ_BINDINGS: ${RABBITMQ_BINDINGS:-}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
      RABBITMQ_RECONNECT_MS: ${RABBITMQ_RECONNECT_MS:-5000}
      DATABASE_PATH: /app/data/notificaciones.sqlite
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - notificaciones_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  rabbitmq_data:
  notificaciones_data:
