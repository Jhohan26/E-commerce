<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e4e7ee;
    --ok:#177245; --ok-bg:#e3f4ea; --bad:#b42318; --link:#1d5fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f29; --text:#e8ebf2; --muted:#98a0b3; --line:#2b3140;
      --ok:#5fd394; --ok-bg:#16301f; --bad:#ff8f84; --link:#7aa9ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:980px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:22px; }
  .estado { font-size:13px; color:var(--muted); }
  .punto { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .punto.off { background:var(--bad); }
  .resumen { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:18px 0; }
  .tarjeta { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
  .tarjeta span { display:block; font-size:12px; color:var(--muted); }
  .tarjeta strong { font-size:22px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--card); color:var(--text); font:inherit; margin-bottom:12px; }
  .tabla { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:11px 16px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  tr:last-child td { border-bottom:0; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  a.pdf { display:inline-block; padding:2px 12px; border-radius:999px; font-size:12px; font-weight:600;
          color:var(--ok); background:var(--ok-bg); text-decoration:none; }
  a.pdf:hover { text-decoration:underline; }
  .vacio { padding:28px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Facturas generadas</h1>
    <div class="estado"><span id="punto" class="punto"></span><span id="estado">Cargando…</span></div>
  </header>

  <section class="resumen">
    <div class="tarjeta"><span>Facturas</span><strong id="r-facturas">–</strong></div>
    <div class="tarjeta"><span>Total facturado</span><strong id="r-total">–</strong></div>
    <div class="tarjeta"><span>Clientes</span><strong id="r-clientes">–</strong></div>
    <div class="tarjeta"><span>Última factura</span><strong id="r-ultima">–</strong></div>
  </section>

  <input id="buscar" type="search" placeholder="Buscar por número, pedido o cliente…" autocomplete="off">

  <div class="tabla">
    <table>
      <thead>
        <tr><th>Número</th><th>Pedido</th><th>Cliente</th><th>Fecha</th><th class="num">Total</th><th>PDF</th></tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
    <div id="vacio" class="vacio" hidden>No hay facturas para mostrar.</div>
  </div>
</main>

<script>
  let datos = [];
  const $ = (id) => document.getElementById(id);
  const moneda = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });

  function celda(tr, texto, clase) {
    const td = document.createElement("td");
    td.textContent = texto;
    if (clase) td.className = clase;
    tr.appendChild(td);
    return td;
  }

  function nombreCliente(f) {
    return f.cliente_nombre || (f.cliente_id != null ? "Cliente #" + f.cliente_id : "–");
  }

  function pintar() {
    const q = $("buscar").value.trim().toLowerCase();
    const lista = datos.filter(f =>
      [f.numero, f.pedido_id, f.cliente_id, f.cliente_nombre]
        .some(v => String(v ?? "").toLowerCase().includes(q)));

    const tbody = $("filas");
    tbody.replaceChildren();
    for (const f of lista) {
      const tr = document.createElement("tr");
      celda(tr, f.numero);
      celda(tr, f.pedido_id);
      celda(tr, nombreCliente(f));
      celda(tr, new Date(f.fecha).toLocaleString("es-CO"));
      celda(tr, moneda.format(f.total), "num");
      const td = document.createElement("td");
      const a = document.createElement("a");
      a.className = "pdf";
      a.href = "/api/facturas/" + f.id + "/pdf";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Ver PDF";
      td.appendChild(a);
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    $("vacio").hidden = lista.length > 0;

    $("r-facturas").textContent = datos.length;
    $("r-total").textContent = moneda.format(datos.reduce((s, f) => s + f.total, 0));
    $("r-clientes").textContent = new Set(datos.filter(f => f.cliente_id != null).map(f => f.cliente_id)).size;
    $("r-ultima").textContent = datos.length ? datos[0].numero : "–";
  }

  async function cargar() {
    try {
      const r = await fetch("/api/facturas");
      if (!r.ok) throw new Error(r.status);
      datos = await r.json();

      let rabbit = "";
      try {
        const h = await (await fetch("/health")).json();
        rabbit = " · RabbitMQ " + h.rabbitmq;
      } catch (e) {}

      $("punto").className = "punto";
      $("estado").textContent = "Actualizado " + new Date().toLocaleTimeString("es-CO") + rabbit;
      pintar();
    } catch (e) {
      $("punto").className = "punto off";
      $("estado").textContent = "Sin conexión con el servicio";
    }
  }

  (async () => {
    $("buscar").addEventListener("input", pintar);
    await cargar();
    setInterval(cargar, 5000);   // refresco automático cada 5 s
  })();
</script>
</body>
</html>
