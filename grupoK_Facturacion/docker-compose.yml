services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Panel web (guest / guest)

  # Opcional: MySQL de pruebas con la base 'facturacion' ya creada.
  # Usa el puerto 3307 para no chocar con un MySQL instalado en tu equipo.
  # En .env: DB_PORT=3307 y DB_PASSWORD=root
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
