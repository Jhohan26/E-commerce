services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Panel web (guest / guest)

  # MySQL de pruebas con la base 'facturacion' ya creada: el esquema va DENTRO de la imagen
  # (Dockerfile.mysql). Usa el puerto 3307 para no chocar con un MySQL instalado en tu equipo.
  # En .env: DB_PORT=3307 y DB_PASSWORD=root
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: facturacion-mysql:1.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  # La API + consumidor en contenedor. No arranca con "docker compose up -d":
  #   docker compose --profile app up -d --build
  # Usa RABBITMQ_URL de tu .env (CloudAMQP). Clientes: el de Kubernetes publicado en localhost:8081.
  api:
    profiles: ["app"]
    build: .
    image: facturacion-app:1.0
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: facturacion
      DB_SOCKET: ""
      CLIENTES_URL: http://host.docker.internal:8081
    ports:
      - "8007:8007"
    depends_on:
      - mysql
